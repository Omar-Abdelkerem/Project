<!DOCTYPE html>
<html>
<head><title>Apply</title></head>
<body>
<h1>Apply for Service</h1>
<form method="POST">
    <label>User ID (Simulated): <input type="text" name="userid" required></label><br>
    <label>Service Type: 
        <select name="type">
            <option value="Passport">Passport</option>
            <option value="ID Card">ID Card</option>
            <option value="Visa">Visa</option>
        </select>
    </label><br>
    <label>Subtype: <input type="text" name="subtype"></label><br>
    <button type="submit">Submit Application</button>
</form>
</body>
</html>
