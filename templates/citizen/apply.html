<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Application - Fast ID System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="container nav-inner">
            <div class="logo">
                <a href="/"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo"></a>
            </div>
            <nav class="links">
                <a href="{{ url_for('citizen.citizen_dashboard') }}" class="nav-link">My Applications</a>
                <a href="{{ url_for('user_controller.logout') }}" class="nav-link logout-btn">Logout</a>
            </nav>
        </div>
    </header>

    <div class="form-container">
        <div class="form-wrapper">
            <div class="form-header">
                <h2>Apply for National ID Card</h2>
                <p>Fill out the form below to submit your National ID card application</p>
            </div>

            {% if errors %}
                <div class="error-list">
                    {% for error in errors %}
                        <div class="error-item">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="type">Application Type *</label>
                    <select id="type" name="type" required>
                        <option value="">Select Application Type</option>
                        <option value="New ID Card" {% if type == 'New ID Card' %}selected{% endif %}>New ID Card</option>
                        <option value="ID Card Replacement" {% if type == 'ID Card Replacement' %}selected{% endif %}>ID Card Replacement</option>
                        <option value="ID Card Renewal" {% if type == 'ID Card Renewal' %}selected{% endif %}>ID Card Renewal</option>
                        <option value="ID Card Update" {% if type == 'ID Card Update' %}selected{% endif %}>ID Card Update</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Additional Information *</label>
                    <textarea id="description" name="description" rows="5" required placeholder="Provide any additional information about your National ID card application...">{{ description or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label for="document">Supporting Documents (Optional but Recommended)</label>
                    <input type="file" id="document" name="document" accept=".pdf,.jpg,.jpeg,.png">
                    <small>Upload your documents in PDF, JPG, or PNG format (Max 5MB per file)</small>
                </div>

                <button type="submit" class="form-submit">Submit Application</button>
            </form>
        </div>
    </div>
</body>
</html>
